name: Auto Deploy Release

# When master advances and manifest.json version has no GitHub Release yet,
# pack the zip and publish it automatically.
on:
  push:
    branches: [master, main]
    paths:
      - "manifest.json"
      - "background.js"
      - "popup.*"
      - "content/**"
      - "lib/**"
      - "icons/**"
      - "package.json"
      - "scripts/pack-release.mjs"
      - ".github/workflows/auto-deploy.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve version
        id: ver
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if already released
        if: steps.ver.outputs.exists == 'true'
        run: echo "Release ${{ steps.ver.outputs.tag }} already exists — skip"

      - name: Pack
        if: steps.ver.outputs.exists == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip
          npm run release

      - name: Publish GitHub Release
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist-release/ebay-tracking-collector-*.zip
            dist-release/latest.json
